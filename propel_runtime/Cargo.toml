[package]
name = "propel_runtime"
version = "0.1.0"
description = """
Dev-mode renderer for Propel: renders templates at request time, reading
the source from disk so edits show up without a rebuild.
"""
license = "MIT OR Apache-2.0"
edition = "2021"
rust-version = "1.75"
publish = false

[dependencies]
propel_parser = { path = "../propel_parser" }
serde = "1"
serde_json = "1"

[lints]
workspace = true

[dev-dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies.criterion]
version = "0.5"
default-features = false

[[bench]]
name = "render"
harness = false
